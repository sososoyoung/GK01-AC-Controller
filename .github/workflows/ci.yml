name: CI

on:
  push:
    branches: [master, dav]
    paths:
      - 'firmware/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'firmware/**'
      - 'scripts/**'
      - 'tests/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run host and WebUI regression tests
        run: |
          python3 scripts/test_storage_ota.py
          python3 scripts/test_live_logs.py
          python3 scripts/test_rboot_cache.py
          node scripts/test_ota_auth.js
          node scripts/test_web_lifecycle.js

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ROM0 (default flash slot)
        run: pio run -e rom0
        working-directory: firmware

      - name: Build ROM1 (OTA update slot)
        run: pio run -e rom1
        working-directory: firmware

      - name: Build factory firmware (OTA disabled)
        run: pio run -e factory
        working-directory: firmware

      - name: Verify ROM0 and ROM1 cache mapping is linked
        run: python3 scripts/test_rboot_cache.py --elf firmware/.pio/build/rom0/firmware.elf --elf firmware/.pio/build/rom1/firmware.elf

      - name: Build flash images (strip eboot from firmware)
        run: python prepare_flash.py both
        working-directory: firmware

      - name: Verify generated OTA and combined images
        run: python3 scripts/verify_ota_images.py firmware/flash_images/ota.bin firmware/flash_images/rom0.bin firmware/flash_images/rom1.bin firmware/flash_images/combined.bin

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firmware-binaries
          path: |
            firmware/.pio/build/*/firmware.bin
            firmware/flash_images/*.bin
          retention-days: 7
          if-no-files-found: warn
