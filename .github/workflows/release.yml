name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ROM0
        run: pio run -e rom0
        working-directory: firmware

      - name: Build ROM1
        run: pio run -e rom1
        working-directory: firmware

      - name: Generate rboot OTA images
        run: python prepare_flash.py both
        working-directory: firmware

      - name: Build combined flash image
        run: python ../scripts/make_combined.py
        working-directory: firmware

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release
          cp firmware/flash_images/combined.bin       "release/combined-${VERSION}.bin"
          cp firmware/flash_images/ota.bin            "release/firmware-ota-${VERSION}.bin"
          cp firmware/flash_images/rom0.bin           "release/firmware-rom0-${VERSION}.bin"
          cp firmware/flash_images/rom1.bin           "release/firmware-rom1-${VERSION}.bin"
          cp firmware/rboot-bootloader/rboot.bin      "release/rboot-${VERSION}.bin"
          sha256sum release/*.bin > release/SHA256SUMS.txt
          ls -la release/

      - name: Verify release firmware images
        run: |
          VERSION="${GITHUB_REF_NAME}"
          python scripts/verify_ota_images.py \
            "release/combined-${VERSION}.bin" \
            "release/firmware-ota-${VERSION}.bin" \
            "release/firmware-rom0-${VERSION}.bin" \
            "release/firmware-rom1-${VERSION}.bin"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📦 固件下载与文件选择

            | 文件 | 用途 |
            |------|------|
            | `combined-${{ github.ref_name }}.bin` | **首刷/救砖首选**：rboot + rboot config + ROM0，一条 esptool 命令刷到 `0x0` |
            | `firmware-ota-${{ github.ref_name }}.bin` | **WebUI OTA 推荐文件**：rboot `EA 04` 应用镜像，内置 `IRACOTA1` manifest + CRC32 |
            | `firmware-rom0-${{ github.ref_name }}.bin` | 兼容别名：内容与 `firmware-ota` 相同，不需要手动按 ROM 选择 |
            | `firmware-rom1-${{ github.ref_name }}.bin` | 兼容别名：内容与 `firmware-ota` 相同，不需要手动按 ROM 选择 |
            | `rboot-${{ github.ref_name }}.bin` | 仅 rboot 引导器；高级分步刷写时写到 `0x0000` |
            | `SHA256SUMS.txt` | 发布文件校验值 |

            **不要把 `firmware-ota` 或 `firmware-rom0/rom1` 用 esptool 写到 `0x0`。** 这些文件是 OTA 应用镜像，不是完整首刷镜像。
            当前 OTA 包采用 slot-independent 设计，设备会根据当前运行分区自动写入 inactive slot；WebUI 的“准备写入 ROM”是操作提示，不是让用户手动指定 flash 地址。

            ---

            ## 🔧 首次刷写教程（推荐 `combined.bin`）

            ### 准备
            - **USB-TTL 转换器**（CH340 / CP2102 等）
            - **杜邦线 4 根**
            - 安装 esptool：`pip install esptool`

            ### 接线

            | USB-TTL | 板子焊盘 |
            |---------|---------|
            | TX | RX |
            | RX | TX |
            | GND | GND |
            | IO0 ↔ GND | （短接进入刷写模式） |

            > ⚠️ 板子 Micro USB **仅供电**，没有数据线，必须用焊盘 TX/RX。

            ### 刷写命令

            ```bash
            # 1. 擦除整个 flash（首次必做，从旧版升级也要）
            python -m esptool --port COMx --baud 115200 --before no-reset erase-flash

            # 2. 刷入 combined.bin（rboot + ROM0 一次搞定）
            python -m esptool --port COMx --baud 115200 --before no-reset write-flash -fm dout 0x0 combined-${{ github.ref_name }}.bin
            ```

            > - 把 `COMx` 换成你的实际串口（Windows 设备管理器查看；macOS/Linux 是 `/dev/ttyUSB0`）
            > - `-fm dout` 是**必须**的，用 `dio`/`qio` 会失败
            > - 刷写完成后必须断开 IO0-GND，再重新上电；否则 ESP8266 会停在下载模式，不会启动应用和 WiFi
            > - 只有 `combined-${{ github.ref_name }}.bin` 适合直接写到 `0x0`

            ### 上电测试

            1. 拔掉 IO0-GND 短接线，重新上电
            2. 手机搜 WiFi：`IR-AC`，密码 `12345678`
            3. 连接后自动弹出控制页面（或访问 `http://10.1.1.1/`）

            ---

            ## 🔄 OTA 升级（已装 v2.0+，无需 USB-TTL）

            1. 浏览器打开 WebUI → **设置** → **固件更新**
            2. 选择 `firmware-ota-${{ github.ref_name }}.bin` 上传
            3. 页面验证通过后点上传，等待 ~30 秒，设备自动重启
            4. 新固件写入另一个分区，启动失败自动回退到旧版本（不会变砖）

            OTA 页面和固件端都会校验镜像：必须是 `prepare_flash.py` 生成的 rboot OTA 应用镜像（`EA 04` new image），flash mode 为 `DOUT(0x03)`，rboot new image 布局正确，内部 checksum 匹配，并带有 `IRACOTA1` manifest。manifest 会校验板型 `GK01_IR_MINI_V105`、目标策略、镜像大小和 CRC32。固件端写入后还会从 flash 回读校验，通过后才切换 ROM。

            > 不要上传 `combined.bin`、`rboot.bin`、`.pio/build/.../firmware.bin`、旧版无 manifest 的 OTA 包，或旧版只剥 eboot 的 `E9` 应用镜像。如果误传导致设备进不了应用代码，软件回滚无法执行，需要用 USB-TTL 重新刷 `combined-${{ github.ref_name }}.bin` 到 `0x0`。

            ---

            ## ✨ 本次更新

            - 遥控首页切换空调／电视，品牌与型号并排，电视按键采用常规遥控布局并适配深浅主题
            - 设备页先显示本机，本机与从机信息独立更新，读取失败自动重试
            - 修复 ROM1 Flash 映射，启动时锁定当前 bank，增加状态字段与 ELF 链接检查
            - GPIO0 作为运行时按键，长按至少 5 秒后松开执行恢复出厂
            - 网页版本、启动日志和默认 OTA manifest 共用版本定义

            > 旧版若已出现“显示 ROM1、界面仍旧”，请先通过 USB-TTL 刷入新版 combined 镜像恢复映射，再继续 OTA。

            完整更新历史及升级注意事项见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)。

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
